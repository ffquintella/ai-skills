[package]
name = "agent-router"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
publish = false
description = "YAML-driven model routing with quota-aware budgets"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
